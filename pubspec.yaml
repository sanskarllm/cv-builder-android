name: cv_builder
description: A modern CV / Resume Builder app for Android. Create professional resumes with templates and export to PDF.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  pdf: ^3.11.1
  printing: ^5.13.3
  path_provider: ^2.1.4
  intl: ^0.19.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
